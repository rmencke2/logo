# Weekly MCP directory refresh — fetches registries and updates committed JSON.
# Requires repo write permissions for the commit step (enable in GitHub Actions settings).

name: Refresh MCP catalog

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: mcp-catalog-main-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and build catalog
        run: npm run refresh-data
        env:
          GLAMA_TARGET: 2000
          GLAMA_DETAIL_DELAY_MS: 200
          SMITHERY_MAX_PAGES: 150
          MCPSERVERS_MAX_PAGES: 120
          MCPSERVERS_PAGE_DELAY_MS: 250

      - name: Commit updated data
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: weekly MCP catalog refresh" \
            data/servers-generated.json \
            data/servers-top100.json \
            data/last-updated.json
