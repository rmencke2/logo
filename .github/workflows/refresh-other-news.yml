name: Refresh other news

on:
  schedule:
    - cron: '0 8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: other-news-main-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and score external MCP articles
        run: npm run refresh-other-news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated articles
        run: |
          chmod +x scripts/ci-commit-push.sh
          scripts/ci-commit-push.sh "chore: refresh In other news articles" \
            data/other-news-articles.json
