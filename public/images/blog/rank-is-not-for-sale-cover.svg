<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Rank is not for sale</title>
  <desc id="desc">A labeled Sponsored card sits above a numbered handshake list that keeps its order.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <g fill="none" stroke="#0f6e6a" stroke-width="2" opacity="0.18">
    <path d="M80 140h220M80 180h140M1040 620h240M1080 660h180"/>
  </g>

  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="148" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="54">Rank is not for sale</text>
  <text x="88" y="190" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="22">A Sponsored label sits above the list. The handshake clock does not move.</text>

  <g transform="translate(88 250)">
    <rect width="520" height="210" rx="16" fill="#fffdf6" stroke="#e8c36a" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="24" y="22" width="132" height="28" rx="14" fill="#fef3c7" stroke="#fde68a"/>
    <text x="90" y="41" text-anchor="middle" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">SPONSORED</text>
    <text x="24" y="92" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">Above the table</text>
    <text x="24" y="128" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">No rank number. No live_ok.</text>
    <text x="24" y="168" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">$249 / month · label only</text>
  </g>

  <g transform="translate(700 250)">
    <rect width="612" height="360" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="42" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">HANDSHAKE SCOREBOARD</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16181d">
      <text x="28" y="100" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01</text>
      <circle cx="92" cy="94" r="7" fill="#4338ca"/>
      <text x="116" y="101">live_ok</text>
      <text x="28" y="164" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02</text>
      <circle cx="92" cy="158" r="7" fill="#b45309"/>
      <text x="116" y="165">auth_required</text>
      <text x="28" y="228" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03</text>
      <circle cx="92" cy="222" r="7" fill="#6d707a"/>
      <text x="116" y="229">unreachable</text>
      <text x="28" y="292" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04</text>
      <circle cx="92" cy="286" r="7" fill="#4338ca"/>
      <text x="116" y="293">live_ok</text>
    </g>
    <text x="28" y="334" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">catalog order · unchanged</text>
  </g>
</svg>
