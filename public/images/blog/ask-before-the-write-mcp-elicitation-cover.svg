<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Ask before the write</title>
  <desc id="desc">Three cards: a confirmation form before a delete, a URL that keeps a secret off the client, and a second tool call that carries the answer.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <g fill="none" stroke="#0f6e6a" stroke-width="2" opacity="0.18">
    <path d="M80 640h180M1100 120h180M1140 160h120"/>
  </g>

  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="156" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="52">Ask before the write</text>
  <text x="88" y="204" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="24">Elicitation on a stateless MCP server.</text>

  <g transform="translate(88 270)">
    <rect width="390" height="360" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">FORM</text>
    <text x="28" y="108" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="26">Delete 1,204 rows</text>
    <text x="28" y="144" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="26">in production?</text>
    <rect x="28" y="190" width="150" height="44" rx="10" fill="#0f6e6a"/>
    <text x="103" y="218" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Accept</text>
    <rect x="190" y="190" width="150" height="44" rx="10" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="265" y="218" text-anchor="middle" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Decline</text>
    <text x="28" y="286" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">A flat confirm.</text>
    <text x="28" y="314" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">The answer comes back</text>
    <text x="28" y="342" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">on the retry.</text>
  </g>

  <g transform="translate(506 270)">
    <rect width="390" height="360" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">URL</text>
    <rect x="28" y="84" width="334" height="64" rx="12" fill="#fef3c7" stroke="#e8c36a"/>
    <text x="48" y="122" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">auth.vendor.com</text>
    <text x="28" y="196" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">The secret stays</text>
    <text x="28" y="234" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">on the other site</text>
    <text x="28" y="302" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">Form mode is forbidden</text>
    <text x="28" y="330" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">for keys and passwords.</text>
  </g>

  <g transform="translate(924 270)">
    <rect width="390" height="360" rx="16" fill="#fffdf6" stroke="#0f6e6a" stroke-width="2"/>
    <text x="28" y="48" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">THE RETRY</text>
    <text x="28" y="110" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">input_required</text>
    <text x="28" y="148" fill="#6d707a" font-family="Georgia, 'Times New Roman', serif" font-size="18">call ends</text>
    <text x="28" y="210" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">tools/call</text>
    <text x="28" y="248" fill="#6d707a" font-family="Georgia, 'Times New Roman', serif" font-size="18">answer attached</text>
    <text x="28" y="318" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">Write on the second call,</text>
    <text x="28" y="346" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">after accept.</text>
  </g>
</svg>
