<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">The registry is not your allowlist</title>
  <desc id="desc">A tall stack of official registry cards beside a short allowlist with one card stopped at the gate.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="156" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="52">The registry is not</text>
  <text x="88" y="214" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="52">your allowlist</text>

  <g transform="translate(88 280)">
    <rect width="560" height="400" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="42" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">OFFICIAL REGISTRY</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#16181d">
      <rect x="28" y="68" width="504" height="52" rx="10" fill="#f6f3ec"/>
      <text x="48" y="100">postgres</text>
      <rect x="28" y="132" width="504" height="52" rx="10" fill="#f6f3ec"/>
      <text x="48" y="164">github</text>
      <rect x="28" y="196" width="504" height="52" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="48" y="228" fill="#9f1239">adult search · namespace accepted</text>
      <rect x="28" y="260" width="504" height="52" rx="10" fill="#f6f3ec"/>
      <text x="48" y="292">browser</text>
      <text x="48" y="360" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">a name was registered · that is all</text>
    </g>
  </g>

  <g transform="translate(720 280)">
    <rect width="592" height="400" rx="16" fill="#fffdf6" stroke="#0f6e6a" stroke-width="2"/>
    <text x="28" y="42" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">TEAM ALLOWLIST</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#16181d">
      <text x="28" y="110">01  postgres</text>
      <text x="28" y="166">02  github</text>
      <text x="28" y="222">03  browser</text>
    </g>
    <rect x="28" y="260" width="536" height="88" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="48" y="296" fill="#9f1239" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.2">STOPPED</text>
    <text x="48" y="324" fill="#9f1239" font-family="Georgia, 'Times New Roman', serif" font-size="20">Not on the list. Official does not matter.</text>
  </g>
</svg>
