<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">What developers are saying about MCP</title>
  <desc id="desc">Three cards quote the arguments developers are having about MCP servers: context before you type, a CLI you already have, and a key that stays outside the agent.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <g fill="none" stroke="#0f6e6a" stroke-width="2" opacity="0.18">
    <path d="M80 640h180M1100 120h180M1140 160h120"/>
  </g>

  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="156" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="52">What developers are saying</text>
  <text x="88" y="204" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="24">Reddit and Hacker News, on MCP servers.</text>

  <g transform="translate(88 270)">
    <rect width="390" height="360" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">BEFORE YOU TYPE</text>
    <rect x="28" y="78" width="334" height="18" rx="9" fill="#efece4"/>
    <rect x="28" y="78" width="118" height="18" rx="9" fill="#0f6e6a"/>
    <text x="28" y="140" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">A third of</text>
    <text x="28" y="178" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">the window</text>
    <text x="28" y="250" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">Tool schemas load</text>
    <text x="28" y="276" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">whether you call them</text>
    <text x="28" y="302" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">or not.</text>
  </g>

  <g transform="translate(506 270)">
    <rect width="390" height="360" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">ALREADY A COMMAND</text>
    <text x="28" y="120" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36">gh issue list</text>
    <text x="28" y="200" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">Use the CLI</text>
    <text x="28" y="238" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">the model knows</text>
    <text x="28" y="302" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">GitHub is the example</text>
    <text x="28" y="328" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">both places reached for.</text>
  </g>

  <g transform="translate(924 270)">
    <rect width="390" height="360" rx="16" fill="#fffdf6" stroke="#0f6e6a" stroke-width="2"/>
    <text x="28" y="48" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">THE BOUNDARY</text>
    <rect x="28" y="84" width="150" height="92" rx="12" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="103" y="138" text-anchor="middle" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">AGENT</text>
    <rect x="210" y="96" width="140" height="68" rx="12" fill="#fef3c7" stroke="#e8c36a"/>
    <text x="280" y="136" text-anchor="middle" fill="#92400e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">KEY</text>
    <text x="28" y="230" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">The key stays</text>
    <text x="28" y="268" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">outside</text>
    <text x="28" y="322" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">A prompt line is a</text>
    <text x="28" y="348" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">soft control.</text>
  </g>
</svg>
