<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Earn links to an MCP directory</title>
  <desc id="desc">Three pages a directory can earn a link to: a method, a guide, and one server listing.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="160" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="56">Earn the link</text>
  <text x="88" y="210" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="24">Point it at a page that answers one question.</text>

  <g transform="translate(88 290)">
    <rect width="380" height="250" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="52" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">METHOD</text>
    <text x="28" y="112" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="32">Handshake</text>
    <text x="28" y="160" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="20">initialize, then tools/list</text>
    <text x="28" y="208" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/methodology</text>
  </g>

  <g transform="translate(510 290)">
    <rect width="380" height="250" rx="16" fill="#ffffff" stroke="#0f6e6a" stroke-width="2"/>
    <text x="28" y="52" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">GUIDE</text>
    <text x="28" y="112" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="32">First server</text>
    <text x="28" y="160" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="20">one tool list, then a job</text>
    <text x="28" y="208" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/insights</text>
  </g>

  <g transform="translate(932 290)">
    <rect width="380" height="250" rx="16" fill="#fffdf6" stroke="#d9d6cc"/>
    <text x="28" y="52" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">LISTING</text>
    <text x="28" y="112" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="32">One server</text>
    <text x="28" y="160" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="20">README badge plus a URL</text>
    <text x="28" y="208" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/mcp/your-slug</text>
  </g>
</svg>
