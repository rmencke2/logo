<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Get started with MCP servers</title>
  <desc id="desc">A client asks a server for its tool list, and three named tools come back.</desc>
  <rect width="1400" height="788" fill="#f6f3ec"/>
  <text x="88" y="92" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">INFLUZER INSIGHT</text>
  <text x="88" y="156" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="58">Get started</text>
  <text x="88" y="204" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="24">One server. A tool list. Then you know it works.</text>

  <g transform="translate(88 280)">
    <rect width="340" height="280" rx="16" fill="#ffffff" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">CLIENT</text>
    <text x="28" y="100" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">Cursor</text>
    <text x="28" y="142" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">Claude</text>
    <text x="28" y="184" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="28">ChatGPT</text>
    <text x="28" y="236" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">asks for tools</text>
  </g>

  <g transform="translate(530 280)">
    <rect width="340" height="280" rx="16" fill="#ffffff" stroke="#0f6e6a" stroke-width="2"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">MCP SERVER</text>
    <text x="28" y="112" fill="#16181d" font-family="Georgia, 'Times New Roman', serif" font-size="32">Discovery</text>
    <text x="28" y="160" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="20">read-only · no key</text>
    <text x="28" y="220" fill="#0f6e6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">tools/list</text>
  </g>

  <g transform="translate(972 280)">
    <rect width="340" height="280" rx="16" fill="#fffdf6" stroke="#d9d6cc"/>
    <text x="28" y="48" fill="#6d707a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1.4">TOOLS</text>
    <text x="28" y="108" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">search_mcp_servers</text>
    <text x="28" y="156" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">get_mcp_server</text>
    <text x="28" y="204" fill="#16181d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">recommend_mcp_servers</text>
    <text x="28" y="248" fill="#4b4e57" font-family="Georgia, 'Times New Roman', serif" font-size="18">named, with a job</text>
  </g>
</svg>
